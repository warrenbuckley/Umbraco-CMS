name: Publish JSON Schema

on:
  push:
    tags:
      - 'release-*'

jobs:
  publish-schema:
    name: Generate and attach schema to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to upload release assets

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install npm dependencies
        working-directory: src/Umbraco.Web.UI.Client
        run: npm ci

      - name: Generate umbraco-package-schema.json
        working-directory: src/Umbraco.Web.UI.Client
        run: npm run generate:jsonschema:dist

      - name: Upload schema to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src/Umbraco.Web.UI.Client/umbraco-package-schema.json
