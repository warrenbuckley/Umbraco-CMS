# Cloudflare Worker: Umbraco JSON Schema Proxy
#
# Deploy:
#   npx wrangler deploy
#
# To bind to a custom domain, set ZONE_NAME and the desired hostname below,
# then run:  npx wrangler deploy --env production
#
# This worker can later be handed to the Umbraco team to run under
# schema.umbraco.com (or similar).

name = "umbraco-schema"
main = "index.js"
compatibility_date = "2024-01-01"

# Default deployment — available at https://umbraco-schema.<account>.workers.dev
[env.production]
# Uncomment and fill in to serve from a custom domain:
# routes = [
#   { pattern = "schema.umbraco.com/*", zone_name = "umbraco.com" }
# ]
