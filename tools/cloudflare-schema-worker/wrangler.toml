# Cloudflare Worker: Umbraco JSON Schema Proxy
#
# Free deployment (workers.dev subdomain):
#   npx wrangler deploy
#   → https://umbraco-schema.<your-account>.workers.dev
#
# URL examples once deployed:
#   /umbraco-package/17.2.2.json           specific version (immutable)
#   /umbraco-package/latest.json           always latest npm release
#   /umbraco-package/v17/latest.json       latest stable within major v17
#
# To move to a custom domain later (e.g. schema.umbraco.io), uncomment
# the routes block below and run:  npx wrangler deploy --env production

name = "umbraco-schema"
main = "index.js"
compatibility_date = "2024-01-01"

# Uncomment to bind to a custom domain:
# [env.production]
# routes = [
#   { pattern = "schema.umbraco.io/*", zone_name = "umbraco.io" }
# ]
